    { id: 'chang', name: '长真元', subtitle: '镜头之外的偏爱', role: '摄影社学长', tag: '慢热 · 温柔', color: '#809cbd', icon: '◈', intro: '他习惯藏在取景框后面，直到你的出现，让他想走进画面。', quote: '「这一次，我想和你一起入镜。」' },
    { id: 'ding', name: '定晨新', subtitle: '和你一起奔向明天', role: '舞蹈社队长', tag: '傲娇 · 陪伴', color: '#9c9f73', icon: '✧', intro: '那个总与你拌嘴的练习室邻居，偷偷记得你所有小小的愿望。', quote: '「别掉队，我会一直等你。」' }

  const stories = {
    ma: {

        '九月的风把招新海报吹得哗哗作响。你抱着校园音乐节的策划本，穿过音乐楼的长廊。大家习惯叫你“王总”——因为你总能把一团乱麻安排得井井有条。',
        '一段吉他声从半开的门里落出来。麻加其坐在窗沿，脚边堆着改了又改的歌词。舞台上耀眼的主唱，此刻对着最后一行发呆。',
        '“王总，救个场？”他抬头笑，“如果一首歌只能留给一个人，你会怎么写最后一句？”'
      ], [c('“先告诉我，那个人是谁。”', 'rehearsal', 2, 1), c('坐下来，陪他把旋律听完。', 'rehearsal', 2, 0), c('“截稿前交给我就行。”', 'rehearsal', 0, 0)]),
      rehearsal: scene(2, '排练后的秘密加场', '音乐楼 · 小礼堂', [
        '排练结束，大家陆续离开。你留下核对设备清单，麻加其却又走回了麦克风前。',
        '“今天还剩一个听众。”他说。礼堂的灯只亮了一半，他唱起那首未完成的歌。你发现，副歌里竟然藏着你上周随口说过的那句话。',
        '最后一个音落下，他没有问好不好听，只问：“明天下午，你愿意和我出去找找灵感吗？”'
      ], [c('答应他，一起去老唱片店。', 'records', 2, 1, 'record'), c('“不如去天台，那里安静。”', 'rooftop', 2, 0, 'roof'), c('先把音响调好，约定在学校聊。', 'rooftop', 0, 0, 'work')]),
      records: scene(3, 'A面的歌，B面的心事', '梧桐路 · 旧唱片店', [
        '唱片店老板把一副试听耳机递给你们。麻加其分给你一边，平日里大大方方的人，却在手指碰到你的那刻突然安静。',
        '他挑中一张没有封面的唱片。“第一次上台，我忘了词。后来大家说我天生适合舞台……其实每次我都怕。”',
        '窗外阳光移过唱片架。他望着你：“如果音乐节那天，我又忘词了呢？”'
      ], [c('“那就看着我，我会把下一句唱给你。”', 'storm', 2, 1), c('在他的歌词本上写下：“慢慢来。”', 'storm', 2, 0), c('帮他整理一份备用歌词。', 'storm', 1, 0)]),
      rooftop: scene(3, '天台的半拍停顿', '音乐楼 · 天台', [
        '你们坐在天台的长椅上，远处球场的哨声混进晚风。麻加其第一次没带吉他，指尖在膝上敲着不稳的节拍。',
        '“有时候我也想，自己除了唱歌，还能让别人喜欢什么。”他的笑淡下来，“你是不是只需要一个能完成演出的主唱？”',
        '你合上策划本。夕阳把他的影子拉得很长，长到与你的影子挨在一起。'
      ], [c('“今天坐在这里的，是我想认识的麻加其。”', 'storm', 2, 1), c('告诉他，你记得他帮新生搬过整天的设备。', 'storm', 2, 0), c('认真讨论下一次排练的安排。', 'storm', 0, 0)]),
      storm: scene(4, '灯熄灭的那一分钟', '音乐节后台 · 雨夜', [
        '音乐节前夜突然下起大雨，露天舞台临时关闭。麻加其的新歌被建议换成观众更熟悉的曲目。',
        '他把改好的歌词折起来：“换吧，别让大家的努力白费。”可是你看见，他攥住纸角的手一直没有松开。',
        '你盘点了能用的场地：学生中心还有一间小剧场，能容下报名的新生。要保住新歌，就要重新协调所有人的时间。'
      ], [c('和他一起争取小剧场，把计划做完整。', 'finale', 2, 1, 'smallstage'), c('问他的想法，陪他录下这首歌。', 'finale', 2, 0, 'recording'), c('尊重换歌安排，先确保演出完成。', 'finale', 0, 0, 'cover')]),
      finale: scene(5, '副歌留给谁', '音乐节 · 演出之后', [
        { flag: 'smallstage', yes: '小剧场的座位坐得满满当当。没有华丽灯光，麻加其却唱得比任何一次排练都认真。唱到最后一句，他终于望向了你。', no: '最终演出顺利结束。散场后，麻加其叫住你，在空荡荡的后台，把那首新歌的最后一段轻轻唱完。' },
        '“我想过很多种结尾，”他说，“后来发现，我其实是想知道，你愿不愿意听下一首。”',
        '人群的喧闹隔着一道门。那张写满修改痕迹的歌词纸，被他郑重地放进你的手心。'
      ], [c('“愿意。但下一首，要写我们两个人。”', 'ending', 2, 1, 'confession'), c('收好歌词，约他明天一起吃早饭。', 'ending', 2, 0), c('“我会一直是你的听众。”', 'ending', 0, 0)]),
      endings: {
        love: { title: '只属于你的安可', label: '心动结局', paragraphs: ['麻加其愣了半拍，笑意才一点点漫上眼睛。“那我得写一首很长的歌。”', '后来每场演出，他都会在开场前朝你的位置看一眼。你也学会了：不必永远做那个照顾所有人的王总，也可以做一个被认真喜欢的人。', '春天的新歌发布那天，作词栏出现了两个名字。最后一句是：人群散去以后，我们的故事才刚开始。'] },
        warm: { title: '明天见，固定听众', label: '温柔结局', paragraphs: [{ flag: 'confession', yes: '麻加其听懂了你的心意，却没有急着许诺：“我想先好好认识工作之外的你，可以慢慢来吗？”你点头，把明早的早餐时间留给了他。', no: '你们没有急着把关系说成某个确定的词。麻加其开始习惯把新旋律先发给你，你开始在日程表里，为两个人的早餐留出空白。' }, '一个月后，他递来一张演出邀请函。背面是手写的小字：“如果你愿意，下次我想正式约你。”', '这段故事停在一个尚未说出口的答案前。你知道，下一次见面，依然值得期待。'] },
        friend: { title: '青春的合唱', label: '友情结局', paragraphs: [{ flag: 'confession', yes: '麻加其认真听完你的话，轻声说：“谢谢你告诉我。但我现在的心意，更像对一位重要朋友的感谢。”你有一点遗憾，也感谢他没有用含糊的答案敷衍你。', no: '你们一起办成了难忘的音乐节。麻加其在庆功会认真感谢你，说没有王总，许多人的第一场舞台都不会发生。' }, '你把歌词收进活动档案，也把这个会紧张、会坚持的主唱记在心里。你们成为最默契的工作搭档。', '有些歌是写给爱情的，有些歌属于整个青春。这一首，你们留给了所有同行的人。'] }
      }
    },
    chang: {
      start: scene(1, '你走进了他的取景框', '星榆大学 · 银杏大道', [
        '校园音乐节的宣传工作落到你手里。大家喊你“王总”，你也习惯了走路时一边看策划本，一边回工作消息。',
        '银杏大道上，你差点撞进一只举着相机的手。长真元及时放下镜头：“小心台阶。”他的声音轻得像一片落叶。',
        '你邀请摄影社帮忙拍宣传照。他点头，却提出一个意外的请求：“可以先拍一张你吗？不是负责人，是今天的你。”'
      ], [c('放下策划本，朝镜头认真笑一下。', 'contact', 2, 1), c('“先让我看看你喜欢拍什么。”', 'contact', 2, 0), c('把拍摄时间记进工作表。', 'contact', 0, 0)]),
      contact: scene(2, '被删掉的第十七张', '摄影社 · 暗房门口', [
        '长真元把样片发给你。人群、舞台、树影都很漂亮，但文件编号从十六直接跳到了十八。',
        '“十七呢？”你问。他低头整理相机带：“没拍好。”屏幕还没关，你已经看见缩略图——你蹲在地上，给一位弄丢节目单的新生画路线。',
        '“我不知道你愿不愿意，让工作以外的样子被别人看见。”他解释。明天是最后一天补拍，你们可以自己决定去哪里。'
      ], [c('“我们去旧温室吧，拍一张不用发布的照片。”', 'glasshouse', 2, 1, 'glass'), c('邀请他拍清晨的图书馆。', 'library', 2, 0, 'library'), c('约在图书馆，先完成宣传任务。', 'library', 0, 0, 'task')]),
      glasshouse: scene(3, '玻璃房里的光', '旧温室 · 午后', [
        '旧温室里有野生的薄荷，玻璃顶漏下细碎的光。你没有急着摆姿势，而是问长真元，为什么总不出现在摄影社的合照里。',
        '“镜头后面比较安全。”他笑了一下，“我知道怎么记录别人，却不知道怎么让别人认识我。”',
        '你把相机接过来。取景框里，他有些无措，却没有躲开。'
      ], [c('先问他是否愿意，再拍下这一刻。', 'exhibition', 2, 1), c('放下相机，听他讲第一张照片的故事。', 'exhibition', 2, 0), c('只拍温室的植物，把相机还给他。', 'exhibition', 0, 0)]),
      library: scene(3, '安静的人，也有回声', '图书馆 · 靠窗阅览区', [
        '清晨的图书馆只听得见翻页声。长真元拍完窗边的光，把一杯温热的牛奶放到你手边。',
        '他翻开旧摄影集。最后一页夹着一张校园合照，所有人都看着镜头，只有拍照的人缺席。',
        '“这些照片证明大家都来过。”他说。你想问，那谁来证明他也在这里？'

        '摄影社临时空出一个个人展位。社长希望长真元交一组自己的作品，他却迟迟没有填好报名表。',
        '桌上是一组很特别的照片：你忙碌的背影、递出的节目单、落在窗边的笑。作品名仍然空白。',
        '“拍的时候没想过展出。”他把相片翻过来，“这是你的生活，我应该先问你。而且……我还没准备好解释，为什么一直在看你。”'

<script>
(function (root) {
  const story = typeof module !== 'undefined' && module.exports ? require('./story') : root.NovelStory;
  const VERSION = 1;
  const hasRoute = route => typeof route === 'string' && story.routes.some(r => r.id === route);
  function fresh(route) {
    if (!hasRoute(route)) throw new Error('Unknown route');
    return { version: VERSION, route, node: 'start', affection: 0, courage: 0, flags: [], history: [] };
  }
  function endingFor(state) {
    if (state.affection >= 8 && state.courage >= 2) return 'love';
    if (state.affection >= 5) return 'warm';
    return 'friend';
  }
  function snapshot(state) {
    return { node: state.node, affection: state.affection, courage: state.courage, flags: state.flags.slice() };
  }
  function validate(raw) {
    // Replaying the choice history validates scores, branches and flags as well as the shape.
    if (!raw || raw.version !== VERSION || !hasRoute(raw.route) || !Array.isArray(raw.history) || raw.history.length > 5) return null;
    let state = fresh(raw.route);
    for (const step of raw.history) {
      if (!step || step.node !== state.node || !Number.isInteger(step.choice)) return null;
      try { state = choose(state, step.choice); } catch (_) { return null; }
    }
    if (raw.node !== state.node || raw.affection !== state.affection || raw.courage !== state.courage || JSON.stringify(raw.flags) !== JSON.stringify(state.flags)) return null;
    return state;
  }
  function choose(state, index) {
    if (state.node === 'ending') throw new Error('The story has ended');
    const node = story.stories[state.route][state.node];
    const option = node && node.choices[index];
    if (!Number.isInteger(index) || !option) throw new Error('Invalid choice');
    return {
      version: VERSION, route: state.route, node: option.next,
      affection: state.affection + option.affection, courage: state.courage + option.courage,
      flags: option.flag ? state.flags.concat(option.flag) : state.flags.slice(),
      history: state.history.concat(Object.assign(snapshot(state), { choice: index }))
    };
  }
  function back(state) {
    if (!state.history.length) return state;
    const previous = state.history[state.history.length - 1];
    return { version: VERSION, route: state.route, node: previous.node, affection: previous.affection, courage: previous.courage, flags: previous.flags.slice(), history: state.history.slice(0, -1) };
  }
  function view(state) {
    const route = story.routes.find(r => r.id === state.route);
    const ending = state.node === 'ending';
    const node = ending ? story.stories[state.route].endings[endingFor(state)] : story.stories[state.route][state.node];
    return Object.assign({}, node, {
      route, ending, endingId: ending ? state.route + ':' + endingFor(state) : '',
      chapter: ending ? 6 : node.chapter,
      progress: ending ? 100 : (node.chapter - 1) * 20,
      relationship: state.affection >= 8 ? '心意相通' : state.affection >= 5 ? '渐渐靠近' : state.affection >= 2 ? '有点在意' : '初次心动',
      paragraphs: node.paragraphs.map(p => typeof p === 'string' ? p : state.flags.includes(p.flag) ? p.yes : p.no)
    });
  }
  function collection(unlocked) {
    return story.routes.map(route => ({ id: route.id, route, endings: Object.keys(story.stories[route.id].endings).map(key => ({
      id: route.id + ':' + key, unlocked: unlocked.includes(route.id + ':' + key),
      title: story.stories[route.id].endings[key].title, label: story.stories[route.id].endings[key].label
    })) }));
  }
  function validUnlocked(raw) {
    const keys = story.routes.flatMap(r => Object.keys(story.stories[r.id].endings).map(k => r.id + ':' + k));
    return Array.isArray(raw) ? Array.from(new Set(raw.filter(k => keys.includes(k)))) : [];
  }
  const api = { fresh, choose, back, view, validate, collection, validUnlocked, endingFor };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.NovelEngine = api;
})(typeof globalThis !== 'undefined' ? globalThis : this);

  function read() {
    const v = engine.view(state);
    return `<article class="reader ${v.route.id}"><div class="reader-nav">${action('home', '← 故事书架', 'back-link')}${action('save', storageError ? '重试保存' : '保存进度', 'back-link')}</div><div class="reader-banner"><span>${v.route.icon} ${v.route.name}的故事</span><span><i></i> ${v.relationship}</span></div><div class="progress" aria-label="剧情进度 ${v.progress}%"><span style="width:${v.progress}%"></span></div><span class="eyebrow">${v.ending ? 'THE END · ' + v.label : 'CHAPTER 0' + v.chapter + ' / 05'}</span><h1 tabindex="-1">${esc(v.title)}</h1>${v.ending ? '' : `<span class="location">⌖ ${esc(v.place)}</span>`}<div class="story-text">${v.paragraphs.map(p => `<p>${esc(p)}</p>`).join('')}</div>${v.ending ? `<div class="ending-stamp"><span>♡</span><strong>已收录至心动手记</strong><small>${unlocked.length} / 9 个结局</small></div><div class="ending-actions">${action('restart', '再写一种可能 ↗', 'primary')}${action('collection', '翻开心动手记', 'secondary')}${action('home', '回到故事书架', 'back-choice')}</div>` : `<div class="choice-caption"><span>轮到你了，王总。</span><small>你的回应是……</small></div><div class="choices">${v.choices.map((c, i) => action('choose', `<span class="choice-letter">${'ABC'[i]}</span><span class="choice-text">${esc(c.text)}</span><span class="choice-arrow">↗</span>`, 'choice', `data-index="${i}"`)).join('')}</div>${state.history.length ? action('back', '↶ 回到上一个选择', 'back-choice') : ''}`}</article>`;
  }
  function collection() {
    return `<section class="collection-page">${action('home', '← 返回书架', 'back-link')}<span class="eyebrow">THE MEMORIES WE KEEP</span><h1 tabindex="-1">心动手记</h1><p class="page-desc">那些走过的故事，都在这里好好保存。</p><div class="collection-count">${unlocked.length}<span>/ 9 种结局已收集</span></div><div class="memory-grid">${engine.collection(unlocked).map(group => `<section class="memory-group ${group.route.id}"><h2><span>${group.route.icon}</span>${group.route.name}</h2>${group.endings.map(e => `<div class="memory ${e.unlocked ? 'unlocked' : ''}"><span class="memory-icon">${e.unlocked ? '♡' : '◇'}</span><div><strong>${e.unlocked ? e.title : '尚未寄出的信'}</strong><small>${e.label} · ${e.unlocked ? '已解锁' : '等待你的选择'}</small></div></div>`).join('')}</section>`).join('')}</div><aside class="letter-note"><span class="letter-icon">✉︎</span><div><strong>心动没有标准答案。</strong><p>选择愿意倾听的回应，能让关系更亲近；勇敢说出心意，也许会打开新的结局。</p></div></aside><div class="begin-actions">${action('routes', '开启另一种可能 ↗', 'primary')}</div></section>`;
  }
  function render(focus = true) {
    app.innerHTML = ({ home, routes, read, collection })[screen]();
    document.querySelector('#counter').textContent = unlocked.length;
    for (const name of ['home', 'collection']) {
      const node = document.querySelector('#nav-' + name);
      const active = screen === name || (name === 'home' && screen === 'routes');
      node.classList.toggle('active', active);
      if (active) node.setAttribute('aria-current', 'page'); else node.removeAttribute('aria-current');
    }
    if (focus) { window.scrollTo(0, 0); app.querySelector('h1')?.focus({ preventScroll: true }); }
  }
  function show(next) {
    state = next;
    const v = engine.view(state);
    if (v.ending && !unlocked.includes(v.endingId)) unlocked.push(v.endingId);
    persist(); screen = 'read'; render();
  }
  document.addEventListener('click', event => {
    const button = event.target.closest('[data-action]');
    if (!button) return;
    switch (button.dataset.action) {
      case 'home': screen = 'home'; render(); break;
      case 'routes': screen = 'routes'; render(); break;
      case 'encounter': selected = button.dataset.route; screen = 'routes'; render(); break;
      case 'select': {
        selected = button.dataset.route; render(false);
        app.querySelector(`[data-route="${selected}"]`).focus({ preventScroll: true }); break;
      }
      case 'collection': screen = 'collection'; render(); break;
      case 'begin':
        if (state && state.node !== 'ending' && !window.confirm('开始新的故事会替换当前阅读进度，已收集的结局会保留。继续吗？')) return;
        show(engine.fresh(selected)); break;
      case 'resume': if (state) show(state); break;
      case 'choose': if (screen === 'read' && state.node !== 'ending') show(engine.choose(state, Number(button.dataset.index))); break;
      case 'back': if (state) show(engine.back(state)); break;
      case 'restart': selected = state.route; screen = 'routes'; render(); break;
      case 'save': if (persist()) { render(false); notify('已保存，心动可以慢慢读。'); } break;
    }
  });
  render(false);
})();

</script>
</body>
</html>
